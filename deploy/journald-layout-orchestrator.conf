# Installed to /etc/systemd/journald.conf.d/ by deploy/bootstrap.sh (#143).
#
# The backend writes structured JSON straight to stdout through the hand-rolled
# {info,warn,error} interface — there is no Pino, and no log file. Under
# systemd stdout lands in the journal, so retention here is a journald setting
# and not a logrotate config.
#
# journald has no per-unit retention, so both settings below are host-wide.
# That is acceptable on a dedicated bench box and is the reason the numbers are
# modest rather than generous.
[Journal]
Storage=persistent
SystemMaxUse=500M
MaxRetentionSec=30day

# Rate limiting off, deliberately. The default (10000 messages per 30 s per
# service) is a sensible protection for a chatty web app and the wrong trade
# for a control system: the moment worth having a log of is a fault cascade,
# which is exactly the moment that trips the limit and starts dropping the
# lines that explain it. "Suppressed N messages" in place of the evidence is
# not a log. SystemMaxUse above is what bounds the disk instead.
RateLimitIntervalSec=0
RateLimitBurst=0
