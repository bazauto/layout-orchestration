name: CI

on:
  push:
    branches: [main]
  # No `branches` filter: CI must run on every pull request, whatever its base.
  # Filtering on [main] silently skipped stacked PRs (#14, #15), which merged
  # with no PR-time checks at all.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Name is deliberately stable and matrix-free: it is the required status check
  # in main's branch protection. A matrix would name the check
  # `test-and-lint (24.x)`, so bumping the Node version would rename the context
  # and silently stop gating merges.
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build backend
        run: npm run build --workspace=packages/backend

      # Both workspaces, because `npm run lint` does not typecheck: ESLint
      # here is not type-aware, so an exhaustiveness hole in a `switch` over a
      # discriminated union is invisible to it. The frontend build was missing
      # from this job entirely, and `diagnosticCoordinate` sat on main
      # returning `undefined` for two diagnostic kinds — a `tsc` error nothing
      # in CI ever ran. `vite build` runs `tsc` first; that is the gate.
      - name: Build frontend
        run: npm run build --workspace=packages/frontend

      # `--with-deps` runs `apt-get update` before installing the system
      # libraries Chromium needs, and `apt-get update` fails as a whole if any
      # configured source is broken -- even one nothing here uses. The runner
      # image ships Google's Chrome repo preconfigured, and on 2026-09-09 it
      # served a `Release` file whose recorded SHA256 for `Packages.gz` did not
      # match the `Packages.gz` it served alongside it, so every run failed on
      # `Hash Sum mismatch` with exit 100. Nothing in this repo installs Google
      # Chrome: Playwright downloads its own Chromium build, and only the
      # distro packages behind it come from apt. So the source is removed
      # rather than the failure retried -- a third party we do not depend on
      # should not be able to fail this job, and a retry would not have helped,
      # because their index stayed inconsistent across reruns.
      - name: Install Playwright browser
        run: |
          # Match on content, not on filename: the source is a deb822
          # `.sources` file on the current image and was a one-line `.list`
          # on older ones, so removing a fixed path silently does nothing.
          # Verified by the failure that removing google-chrome.list left
          # apt still fetching dl.google.com.
          for f in $(grep -rl "dl\.google\.com" /etc/apt/sources.list.d/ 2>/dev/null); do
            echo "removing unused apt source: $f"
            sudo rm -f "$f"
          done
          sudo sed -i "/dl\.google\.com/d" /etc/apt/sources.list 2>/dev/null || true
          # Fail loudly here rather than 40 lines later inside apt, if a
          # future image puts it somewhere this does not reach.
          if grep -rq "dl\.google\.com" /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null; then
            echo "::error::Google apt source still configured; apt-get update will fail on it"
            exit 1
          fi
          npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      # `always()`, not the default: the run this evidence exists for is the
      # one that just failed, and the default `success()` would discard it
      # precisely then.
      #
      # `playwright-report/` only, deliberately. The HTML reporter copies every
      # attachment into `playwright-report/data/`, so `test-results/` is a
      # byte-for-byte duplicate of the same traces, videos and screenshots —
      # uploading both doubles the artifact and adds nothing. Path is
      # gitignored, so none of this is ever committed.
      #
      # To read it: download the artifact, then `npx playwright show-report
      # <dir>`. Serving it is required rather than fussiness — opening
      # index.html over file:// cannot fetch the trace archives.
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence
          path: playwright-report/
          retention-days: 14
          # A run that fails before Playwright executes (lint, unit tests)
          # leaves nothing to upload; that is expected, not a CI error.
          if-no-files-found: ignore
